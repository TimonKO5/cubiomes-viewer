name: Build Cubiomes Viewer 26.2 for Windows

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout v26.2
        uses: actions/checkout@v4
        with:
          ref: v26.2
          submodules: recursive

      - name: Install Qt 5.15.2
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          archives: 'qtbase qttools'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: cmd
        run: |
          if not defined VCToolsInstallDir (echo VCToolsInstallDir is not set & exit /b 1)
          set "PATH=%VCToolsInstallDir%\bin\Hostx64\x64;%PATH%"
          where link
          qmake cubiomes-viewer.pro CONFIG+=release
          nmake

      - name: Package
        shell: cmd
        run: |
          mkdir dist
          if exist release\cubiomes-viewer.exe (
            copy release\cubiomes-viewer.exe dist\
          ) else if exist debug\cubiomes-viewer.exe (
            copy debug\cubiomes-viewer.exe dist\
          ) else if exist cubiomes-viewer.exe (
            copy cubiomes-viewer.exe dist\
          ) else (
            echo Executable not found!
            dir /s *.exe
            exit /b 1
          )
          windeployqt --dir dist dist\cubiomes-viewer.exe --compiler-runtime --no-translations --no-system-d3d-compiler --no-opengl-sw --no-angle

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: cubiomes-viewer-26.2-windows
          path: dist
          if-no-files-found: error
